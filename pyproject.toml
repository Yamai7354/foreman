[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foreman"
version = "1.0.0"
description = "Foreman - Documentation, Diagrams, GitHub, and Workflow Tools for developers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Randy Johnson"}
]
keywords = ["developer-tools", "documentation", "diagrams", "github", "workflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "GitPython>=3.1.0",
    "requests>=2.31.0",
    "python-dateutil>=2.8.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
foreman = "tools.cli:main"
autolog = "tools.auto_logger:cli_main"
codewatch = "tools.code_watcher:cli_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
